    <h1 class="sr-only">내 친구 정혁이 (내친정) - 김선홍 지음</h1>
    <img src="images/01.webp" alt="내 친구 정혁이 MY FRIEND JUNGHYUK. 기타, 키보드, 앰프, 케이블이 흩어져 있는 타이틀 이미지. 책 표지 목업(표지와 목업은 예시이며 변경될 수 있습니다). 우정은 아름답다고? 9년을 버텨 보고 말해라. 『내 친구 정혁이』 김선홍 지음. 빗자루로 기타를 치던 교실에서 시작된 세 친구의 웃기고도 짠한 9년. 교복 입은 친구들이 빗자루와 대걸레로 기타를 치며 노는 일러스트. 책에 관하여: 기어이 친구를 9년 동안 관찰하고 이야기로 만들었습니다. 책의 앞표지와 뒷표지 목업(표지와 목업은 제작 시안이며 일부 변경될 수 있습니다). 밴드를 만들고, 함께 살고, 먹고살 일을 구하고, 어쩌다 무대에도 올랐습니다.">
    <img src="images/02.webp" alt="책 살펴보기. SCENE 1 밴드 결성 첫날: 계획은 완벽했다. 노래만 빼면. 2012년, 고등학교 교실. 빗자루로 기타를 치고 코로 노래를 부르던 친구가 인디밴드 보컬이 되어 세상을 제패하겠다고 했습니다. 그리고 밴드 결성 첫날, 합주는 중단됐다. (기타, 키보드, 드럼, 보컬이 모인 밴드 일러스트) SCENE 2 음대 입시: 아무도 끊지 않았는데, 스스로 멈췄다. 모두가 후렴도 채 듣지 않고 1절에서 끊길래 자신감이 하락한 정혁이는 급기야 B대학 입시에서 스스로 1절까지만 불렀다. 교수들이 왜 끊었냐며 째려봤고 정혁이는 발을 저리며 변명했다. '아.. 다른 학교에서는 1절에서 끊길래...' (기타를 든 정혁이와 입시 면접관 교수들 일러스트) 이 소설같은 찐따의 이야기는 모두 진짜이다!! 실제 인물 사진: 정혁(가운데) 보컬, 세상을 제패하겠다고 선언한 친구이자 이 책의 주인공. 용준(왼쪽) 기타와 작곡을 맡은 친구, 빗자루가 진짜 기타가 된 뒤에도 함께한 사람. 선홍(오른쪽) 건반을 맡았고, 이 책을 쓴 관찰자. 정혁이를 모르셔도 괜찮습니다. 읽는 동안 당신의 친구가 떠오른다면, 이 이야기는 조금 익숙한 이야기일지도 모릅니다. 이런 이야기가 담겼습니다: 밴드를 만들던 날, 음악보다 생활이 먼저였던 날, 악기를 들고 영등포로 향하던 날, 친구가 마이크 앞에 서던 날, 초중고 심지어 대학교까지 왕따 당한 썰, 같은 꿈을 꾸면서도 서로를 이해하지 못하던 날, 삶과 이상 사이에서 정신병이 걸린 썰, 운전하다가 갯벌에 빠지고 태풍에 미끄러져 폐차한 썰, 웃어넘기던 말들이 더는 웃기지 않던 날, 결국 정혁이와 갈라서던 날. 왜 책을 썼나요? 『내 친구 정혁이』를 쓰기 시작한 건 저 역시 군 복무 중이던 때였습니다. 당시 총기관리병이었던 정혁이는 검사를 앞두고 총을 손질하다가 가스 조절기를 잃어버렸습니다. 결국 온 부대가 개인정비 시간까지 반납하며 뒤졌죠. 전 부대원이 뻥이를 친 끝에 정혁이는 선임·후임 할 것 없이 대차게 까였습니다. 정혁이에게 이런 일이 한두번이 아니었습니다. 그 이야기를 듣고 한마디를 툭 던졌습니다. '야, 너는 진짜... 네 얘기로 책도 쓰겠다ㅋㅋㅋ' (책상다리로 앉아 손짓하는 정혁이 일러스트)">
    <img src="images/03.webp" alt="그런데 문득 이런 생각이 들었습니다. '잠깐, 그럼 그냥 내가 쓰면 되잖아?' 이 처량하면서도 블랙코미디 같은 인생을 누구보다 가까이에서 오래 지켜본 사람이 저였으니까요. 그날부터 위병근무 때면 간부들 몰래 공책을 폈습니다. 저도 정혁이 이야기는 실물로 한 권 만들어 소장하고 싶었을 뿐입니다. 그런데 '주변 친구들에게 나눠주자'가 '아니, 독립출판을 해보자'로 커졌습니다. 출판도 안 해본 제가 이것저것 찾아보던 중 마음연결이라는 출판사를 만났습니다. 그리고 '독립출판으로 하기엔 너무 아깝습니다. 세상에 반드시 나와야 합니다!'라는 대표님의 사탕발림에 홀랑당 넘어갔죠. 이 말을 들었을 때는 머리가 쭈뼛 설 정도였습니다. 결국 출판을 결정했습니다. 이 책의 작가는 사실 저 혼자가 아닙니다. 정혁이가 지난 9년 동안 자신의 이야기를 빼곡하게 풀어줬기에 가능했던 책이니까요. 자기 입으로 썰을 푸는 것과 남의 시선과 문장으로 자기 인생을 읽는 건 사뭇 다른 일입니다. 완성된 글을 읽은 정혁이는 이렇게 말했습니다. '내가 얼마나 한심하고 처량한 존재였는지 다시 한번 반추해볼 수 있는 좋은 자아성찰의 기회였다.' 누군가 여러분의 인생으로 글을 쓴다면 어떤 기분일까요? 일기장을 들키는 것보다 더 발가벗겨진 기분일지도 모릅니다. 물론 본 저서에는 정혁이의 나체가 포함되어 있지 않으니 안심하고 읽어주셔도 됩니다. 도서 정보 - 도서명: 내 친구 정혁이 / 지은이: 김선홍 / 분야: 논픽션 / 크기: 148*210mm / 분량: 약 380쪽 / 제본: 무선 / 발행: 2026년 11월 예정. 행복회로 굴려보기: 안달루시아 라이브 콘서트 티켓(일시 미정, 장소 미정). 150만원 이상 후원을 받게 된다면 책에서 읽은 정혁이의 노래, 직접 들어보실래요? 책 속 밴드 안달루시아가 함께 연주하는 자리를 준비합니다. 이번에는 친구가 쓴 문장 대신, 정혁이의 목소리로 만나보세요. (후원 굿즈로 열도록 하겠습니다.)">
  </main>

  <div class="banner">
    <div class="banner-inner">
      <div class="count">
        펀딩 마감까지
        <strong id="countdown">--일 --시간 --분 --초 남음</strong>
      </div>
      <a class="btn" href="https://tumblbug.com/ncj" target="_blank" rel="noopener">텀블벅에서 펀딩하기</a>
    </div>
  </div>

  <script>
    var target = new Date("2026-12-02T00:00:00+09:00").getTime();
    var el = document.getElementById("countdown");
    function pad(n) { return String(n).padStart(2, "0"); }
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { el.textContent = "펀딩이 마감되었습니다"; return; }
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor(s % 86400 / 3600);
      var m = Math.floor(s % 3600 / 60);
      el.textContent = pad(d) + "일 " + pad(h) + "시간 " + pad(m) + "분 " + pad(s % 60) + "초 남음";
    }
    tick();
    setInterval(tick, 1000);
  </script>
